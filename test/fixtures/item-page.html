<!doctype html>
<!-- Hand-built to mirror eBay's 2025-26 item page markup (live pages block automated fetches). -->
<html>
  <head>
    <meta property="og:image" content="https://i.ebayimg.com/images/g/OGFALLBACK/s-l400.jpg" />
  </head>
  <body>
    <div class="ux-image-carousel-container" data-testid="ux-image-carousel-container">
      <div class="ux-image-carousel">
        <div class="ux-image-carousel-item active">
          <img src="https://i.ebayimg.com/images/g/AAAAbbbbCCCC/s-l500.webp"
               data-zoom-src="https://i.ebayimg.com/images/g/AAAAbbbbCCCC/s-l1600.webp" />
        </div>
        <div class="ux-image-carousel-item">
          <img data-src="https://i.ebayimg.com/images/g/DDDD~eeeFFFF/s-l500.jpg" />
        </div>
        <div class="ux-image-carousel-item">
          <picture>
            <source srcset="https://i.ebayimg.com/images/g/GGGG-hhhh/s-l300.webp 1x, https://i.ebayimg.com/images/g/GGGG-hhhh/s-l960.webp 2x" />
            <img src="https://i.ebayimg.com/images/g/GGGG-hhhh/s-l300.jpg" />
          </picture>
        </div>
      </div>
    </div>
    <div class="ux-image-filmstrip">
      <img src="https://i.ebayimg.com/images/g/AAAAbbbbCCCC/s-l64.jpg" />
    </div>

    <div class="x-sellercard"><img src="https://i.ebayimg.com/images/g/SELLERLOGO/s-l64.jpg" /></div>

    <div class="vim x-sell-like">
      <a class="ux-call-to-action" href="/sl/prelist/suggest?sellLikeItem=123456789012&amp;mode=SellLikeItem">
        <span class="ux-call-to-action__cell"><span class="ux-call-to-action__text">Sell one like this</span></span>
      </a>
    </div>

    <div class="d-item-description">
      <iframe id="desc_ifr" src="https://itm.ebaydesc.com/itmdesc/123456789012?t=0&amp;category=1"></iframe>
    </div>

    <div class="recommendations">
      <img src="https://i.ebayimg.com/images/g/RECOMMENDED/s-l225.jpg" />
    </div>
  </body>
</html>
