# Push a tag like v0.3.0 to publish a release: Mozilla signs the extension
# (unlisted), the signed .xpi is attached to a GitHub release, and updates.json
# on main is updated so installed copies update themselves.
#
# Needs repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET
# (addons.mozilla.org -> Developer Hub -> Manage API Keys).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version v$version"
            exit 1
          fi

      - run: npm test
      - run: npm run lint

      - name: Build unsigned zip
        run: npx web-ext build --source-dir extension --artifacts-dir dist --filename "baycopier-${GITHUB_REF_NAME}.zip"

      - name: Sign with Mozilla (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$WEB_EXT_API_KEY" ] || [ -z "$WEB_EXT_API_SECRET" ]; then
            echo "Missing AMO_JWT_ISSUER / AMO_JWT_SECRET repository secrets"
            exit 1
          fi
          npx web-ext sign --source-dir extension --channel unlisted --artifacts-dir signed
          mv signed/*.xpi "dist/baycopier-${GITHUB_REF_NAME}.xpi"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.xpi --title "BayCopier $GITHUB_REF_NAME" --generate-notes

      - name: Point updates.json at the new version
        run: |
          xpi="dist/baycopier-${GITHUB_REF_NAME}.xpi"
          cp "$xpi" /tmp/signed.xpi
          git fetch origin main
          git checkout main
          node scripts/add-update.js /tmp/signed.xpi \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/baycopier-${GITHUB_REF_NAME}.xpi"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.json
          git commit -m "updates.json: ${GITHUB_REF_NAME}"
          git push origin main
