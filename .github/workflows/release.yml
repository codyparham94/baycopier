# Push a tag like v0.3.0 to publish a release. Installed copies of BayCopier
# check the latest release and offer the attached .zip as an update.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag matches manifest version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version v$version"
            exit 1
          fi

      - run: npm test
      - run: npm run lint

      - name: Build extension zip
        run: npx web-ext build --source-dir extension --artifacts-dir dist --filename "baycopier-${GITHUB_REF_NAME}.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "BayCopier $GITHUB_REF_NAME" --generate-notes
